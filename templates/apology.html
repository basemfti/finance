{% extends "layout.html" %}

{% block title %}
Something went wrong
{% endblock %}

{% block main %}
     <section class="panel error-panel">
         <p class="error-code">Error {{ top }}</p>
         <h1 class="page-title">We couldn’t complete that request</h1>
         <p class="page-subtitle my-3">{{ bottom | replace("-", " ") }}</p>
         <a class="btn btn-primary mt-2" href="{{ url_for('index') if session.get('user_id') else url_for('login') }}">Return to Finance</a>
     </section>
{% endblock %}
