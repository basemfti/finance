{% extends "layout.html" %}

{% block title %}
Buy shares
{% endblock %}

{% block main %}
<header class="page-heading text-center">
    <p class="eyebrow">Build your portfolio</p>
    <h1 class="page-title">Buy shares</h1>
    <p class="page-subtitle">Enter a ticker symbol and the number of shares.</p>
</header>
<section class="panel form-panel">
    <div class="panel-body">
        <form action="{{ url_for('buy') }}" method="post">
            <div class="mb-3 text-start">
                <label class="form-label" for="symbol">Stock symbol</label>
                <input autocomplete="off" autofocus class="form-control text-uppercase" id="symbol" name="symbol" placeholder="For example, AAPL" required type="text">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label" for="shares">Number of shares</label>
                <input class="form-control" id="shares" name="shares" min="1" step="1" placeholder="1" required type="number">
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Buy shares</button>
        </form>
    </div>
</section>
{% endblock %}
