{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
   <header class="page-heading text-center">
        <p class="eyebrow">Get started</p>
        <h1 class="page-title">Create your account</h1>
        <p class="page-subtitle">A better view of your investments starts here.</p>
    </header>
    <section class="panel form-panel">
        <div class="panel-body">
            <form action="{{ url_for('register') }}" method="post">
                <div class="mb-3 text-start">
                    <label class="form-label" for="username">Username</label>
                    <input autocomplete="username" autofocus name="username" id="username" class="form-control" placeholder="Choose a username" required type="text">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label" for="password">Password</label>
                    <input autocomplete="new-password" name="password" id="password" class="form-control" placeholder="Create a password" required type="password">
                </div>
                <div class="mb-4 text-start">
                    <label class="form-label" for="confirmation">Confirm password</label>
                    <input autocomplete="new-password" name="confirmation" id="confirmation" class="form-control" placeholder="Enter your password again" required type="password">
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
            </form>
            <p class="form-help">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
        </div>
    </section>
{% endblock %}
